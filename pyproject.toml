[project]
name = "hlip-clf-g1"
version = "0.1.0"
description = "HLIP + CLF walking task for mjlab"
readme = "README.md"
authors = [
    { name = "CodrinCrismariu", email = "codrincrismariu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mjlab>=1.1.0",
    "scipy",
]

[project.scripts]
hlip-clf-g1 = "hlip_clf_g1:main"
custom_train = "hlip_clf_g1.custom_train:main"

[project.entry-points."mjlab.tasks"]
hlip_clf_g1 = "hlip_clf_g1"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab" }
